name: Verify PHP images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: PHP ${{ matrix.php-version }} smoke test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          build-args: PHP_VERSION=${{ matrix.php-version }}
          tags: docker-php:smoke-${{ matrix.php-version }}
          cache-from: type=gha,scope=ghcr-php-${{ matrix.php-version }}

      - name: Test HTTP, health, and local services
        run: tests/smoke.sh docker-php:smoke-${{ matrix.php-version }}
