name: Clean cache images
run-name: Clean cache images (requested by ${{ github.actor }})

on: workflow_dispatch

permissions:
  contents: read

jobs:
  remove-old-containers:
    name: Prune old cache image versions
    runs-on: ubuntu-24.04
    steps:
      - name: Decode the GitHub App Private Key
        id: decode
        run: |
          private_key=$(echo "${{ secrets.GH_APP_PRIVATE_KEY }}" | base64 -d | awk 'BEGIN {ORS="\\n"} {print}' | head -c -2) &> /dev/null
          echo "::add-mask::$private_key"
          echo "private-key=$private_key" >> "$GITHUB_OUTPUT"
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ steps.decode.outputs.private-key }}

      - name: Prune cache image versions older than seven days
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          image-names: docker-php-cache
          cut-off: 7d
          token: ${{ steps.generate-token.outputs.token }}
