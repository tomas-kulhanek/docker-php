name: Clean old images
run-name: Clean old images (requested by ${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without removing images
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  remove-old-containers:
    name: Review and prune image versions
    runs-on: ubuntu-24.04
    steps:
      - name: Decode the GitHub App Private Key
        id: decode
        run: |
          private_key=$(echo "${{ secrets.GH_APP_PRIVATE_KEY }}" | base64 -d | awk 'BEGIN {ORS="\\n"} {print}' | head -c -2) &> /dev/null
          echo "::add-mask::$private_key"
          echo "private-key=$private_key" >> "$GITHUB_OUTPUT"
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ steps.decode.outputs.private-key }}
      - name: Review and prune old application image versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          image-names: docker-php
          image-tags: |
            !latest
            !*-latest
          cut-off: 30d
          keep-n-most-recent: 5
          dry-run: ${{ inputs.dry_run }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Review and prune old cache image versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          image-names: docker-php-cache
          cut-off: 1w
          dry-run: ${{ inputs.dry_run }}
          token: ${{ steps.generate-token.outputs.token }}
