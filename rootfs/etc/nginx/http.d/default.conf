server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    index index.php;
    root /app/public;

    access_log /dev/stdout json_analytics;
    error_log /dev/stderr warn;

    fastcgi_read_timeout 300s;
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;

    # Never serve hidden files from the public document root.
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Allow fpm ping and status from localhost
    location ~ ^/(fpm-status|php-fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass localhost:9000;
    }

    if (-f $document_root/maintenance.html) {
            return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
            rewrite ^(.*)$ /maintenance.html break;
    }

    location ~* \.(?:jpg|jpeg|gif|png|webp|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|js|css)$ {
      etag on;
      if_modified_since exact;
      add_header Pragma "public";
      add_header Cache-Control "public, max-age=86400,no-transform";
    }
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~* \.(woff2?|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        return 404;
    }
}
